<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — Facility Technician Checklist</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">FACILITY TECHNICIAN CHECKLIST</div>
      <p class="login-sub">Sign in to continue</p>

      <form id="login-form">
        <label class="form-field">
          <span>User ID</span>
          <input type="text" id="l-userid" autocomplete="username" required />
        </label>
        <label class="form-field">
          <span>Password</span>
          <input type="password" id="l-password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="login-error hidden">Incorrect User ID or password.</p>
        <button type="submit" class="btn-primary login-btn">Sign In</button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorMsg = document.getElementById("login-error");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const userId = document.getElementById("l-userid").value.trim();
      const password = document.getElementById("l-password").value;
      const user = USERS[userId];

      if (!user || user.password !== password) {
        errorMsg.classList.remove("hidden");
        return;
      }

      localStorage.setItem(
        SESSION_KEY,
        JSON.stringify({ userId, role: user.role, label: user.label })
      );

      const params = new URLSearchParams(window.location.search);
      window.location.href = params.get("next") || "index.html";
    });
  </script>
</body>
</html>
