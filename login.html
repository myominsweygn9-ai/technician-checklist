<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — Facility Technician Checklist</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">FACILITY TECHNICIAN CHECKLIST</div>
      <p class="login-sub">Sign in to continue</p>

      <form id="login-form">
        <label class="form-field">
          <span>Email</span>
          <input type="email" id="l-userid" autocomplete="username" required />
        </label>
        <label class="form-field">
          <span>Password</span>
          <input type="password" id="l-password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="login-error hidden">Incorrect email or password.</p>
        <button type="submit" class="btn-primary login-btn">Sign In</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorMsg = document.getElementById("login-error");
    const submitBtn = form.querySelector("button[type=submit]");

    // If someone is already signed in (e.g. this tab was left open),
    // skip straight past the login form.
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get("next") || "index.html";
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");
      const email = document.getElementById("l-userid").value.trim();
      const password = document.getElementById("l-password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      firebase
        .auth()
        .signInWithEmailAndPassword(email, password)
        .then(() => {
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get("next") || "index.html";
        })
        .catch(() => {
          errorMsg.classList.remove("hidden");
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign In";
        });
    });
  </script>
</body>
</html>
